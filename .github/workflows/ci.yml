name: ci

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v2
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v
    - name: Compile modified demo targets
      run: |
        xcodebuild -project Demo/GridDemo.xcodeproj -target "GridDemo macOS" -configuration Debug -sdk macosx CODE_SIGNING_ALLOWED=NO build
        xcodebuild -project Demo/GridDemo.xcodeproj -target "GridDemo tvOS" -configuration Debug -sdk appletvsimulator CODE_SIGNING_ALLOWED=NO build
        xcodebuild -project Demo/GridDemo.xcodeproj -target "GridDemo watchOS WatchKit Extension" -configuration Debug -sdk watchsimulator CODE_SIGNING_ALLOWED=NO build
