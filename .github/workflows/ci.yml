name: ci

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v2
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v
    - name: Compile modified demo targets
      run: |
        derived_data="$RUNNER_TEMP/GridDemoDerivedData"
        xcodebuild -project Demo/GridDemo.xcodeproj -scheme "GridDemo macOS" -configuration Debug -sdk macosx -derivedDataPath "$derived_data" CODE_SIGNING_ALLOWED=NO build
        xcodebuild -project Demo/GridDemo.xcodeproj -scheme "GridDemo tvOS" -configuration Debug -sdk appletvsimulator -derivedDataPath "$derived_data" CODE_SIGNING_ALLOWED=NO build
        xcodebuild -project Demo/GridDemo.xcodeproj -scheme "GridDemo watchOS" -configuration Debug -sdk iphonesimulator -derivedDataPath "$derived_data" CODE_SIGNING_ALLOWED=NO build
